<header class="topbar">
  <button
    pButton
    type="button"
    icon="pi pi-bars"
    class="p-button-text p-button-plain topbar__menu-btn"
    aria-label="Open navigation menu"
    (click)="menuToggle.emit()"
  ></button>

  <div class="topbar__spacer"></div>

  <button
    pButton
    type="button"
    [icon]="darkMode() ? 'pi pi-sun' : 'pi pi-moon'"
    class="p-button-text p-button-plain topbar__icon-btn"
    pTooltip="Toggle theme"
    tooltipPosition="bottom"
    [attr.aria-label]="darkMode() ? 'Switch to light theme' : 'Switch to dark theme'"
    [attr.aria-pressed]="darkMode()"
    (click)="toggleDarkMode()"
  ></button>

  <a
    routerLink="/notification-system/push-notifications"
    class="topbar__icon-btn topbar__bell"
    pTooltip="Notifications"
    tooltipPosition="bottom"
    aria-label="Notifications, 3 unread"
  >
    <span class="pi pi-bell" aria-hidden="true"></span>
    <p-badge value="3" severity="danger" />
  </a>

  <button
    class="topbar__user"
    type="button"
    [attr.aria-label]="'Account menu for ' + (user()?.fullName ?? 'current user')"
    aria-haspopup="menu"
    (click)="userMenu.toggle($event)"
  >
    <p-avatar [label]="user()?.initials" shape="circle" styleClass="topbar__avatar" [style]="{ 'background-color': user()?.avatarColor, color: '#fff' }" />
    <span class="topbar__user-text">
      <strong>{{ user()?.fullName }}</strong>
      <small>{{ roleLabel() }}</small>
    </span>
    <span class="pi pi-angle-down" aria-hidden="true"></span>
  </button>
  <p-menu #userMenu [model]="userMenuItems" [popup]="true" />

  <button
    pButton
    type="button"
    icon="pi pi-sign-out"
    class="p-button-text p-button-plain topbar__icon-btn topbar__logout"
    pTooltip="Sign out"
    tooltipPosition="bottom"
    aria-label="Sign out"
    (click)="logout()"
  ></button>
</header>
