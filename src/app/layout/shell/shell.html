<div class="shell" [class.shell--sidebar-open]="sidebarOpen()">
  <!-- A real <button> rather than a click-handling <div>: the backdrop is the
       only way to dismiss the mobile sidebar, so it has to be reachable by
       keyboard and announced, not just clickable with a mouse. -->
  <button type="button" class="shell__backdrop" aria-label="Close navigation menu" (click)="closeSidebar()"></button>

  <app-sidebar class="shell__sidebar" />

  <div class="shell__main">
    <app-topbar (menuToggle)="toggleSidebar()" />
    <main class="shell__content">
      <app-breadcrumb />
      <router-outlet />
    </main>
  </div>
</div>

<p-toast position="top-right" />
<p-confirmdialog />
