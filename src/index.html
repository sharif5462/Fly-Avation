<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aviation ERP</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applied before Angular boots so there's no flash of the light theme
    // when the user has dark mode saved from a previous visit.
    (function () {
      try {
        if (localStorage.getItem('aviation_erp_dark_mode') === 'true') {
          document.documentElement.classList.add('app-dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
